experiment_id: E1_OFFICIAL
seed: 42
runs_dir: runs
model:
  name: cdcn_official
  theta: 0.7
data:
  manifest: data/manifests/all-with-depth.csv
  source_manifest: data/manifests/all.csv
  depth_ledger: /content/data/depth/depth_status.csv
  root: /content/data
  image_size: 256
  normalization: cdcn_official
loss:
  lambda_abs: 1.0
  lambda_contrast: 1.0
  implementation: official_cdcn
training:
  epochs: 30
  lr: 0.0001
  batch_size: 8
  workers: 2
  weight_decay: 0.0001
  optimizer: adam
evaluation:
  aggregation: mean
