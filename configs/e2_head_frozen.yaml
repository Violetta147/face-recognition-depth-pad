experiment_id: E2_OFFICIAL_HEAD
seed: 42
runs_dir: runs
model:
  name: cdcn_official_head
  theta: 0.7
data:
  manifest: data/manifests/all.csv
  root: /content/data
  image_size: 256
  normalization: cdcn_official
loss:
  classification: bce
  lambda_abs: 0.0
  lambda_contrast: 0.0
  lambda_cls: 1.0
training:
  init_checkpoint: runs/REPLACE_WITH_OFFICIAL_E1_RUN/best.ckpt
  batch_size: 8
  workers: 2
  weight_decay: 0.0001
  stages:
  - name: head
    epochs: 10
    lr: 0.001
  optimizer: adam
evaluation:
  aggregation: mean
