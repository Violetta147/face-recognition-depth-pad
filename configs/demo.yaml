camera:
  source: 0
  width: 1280
  height: 720
  fps: 30
  mirror: true

detector:
  backend: onnx_scrfd
  model_path: artifacts/models/buffalo_s/det_500m.onnx
  device: cpu
  detection_size: [320, 320]
  interval_frames: 2
  confidence_threshold: 0.60

recognition:
  model_path: artifacts/models/buffalo_s/w600k_mbf.onnx
  model_version: buffalo_s/w600k_mbf
  alignment_size: 112
  gallery_path: artifacts/gallery/gallery.npz
  similarity: cosine
  threshold: 0.47
  min_face_size: 80
  blur_threshold: 60.0

enrollment:
  target_samples: 20
  min_detection_confidence: 0.75
  min_sample_interval_ms: 150

privacy:
  save_frames: false
  save_embeddings_in_log: false
