experiment_id: E4_OFFICIAL_HEAD
seed: 42
runs_dir: runs
model:
  name: cdcn_official_head
  theta: 0.7
data:
  manifest: data/manifests/all-with-depth.csv
  source_manifest: data/manifests/all.csv
  depth_ledger: /content/data/depth/depth_status.csv
  root: /content/data
  image_size: 256
  normalization: cdcn_official
loss:
  classification: focal
  alpha: 0.25
  gamma: 2.0
  lambda_abs: 1.0
  lambda_contrast: 1.0
  lambda_cls: 1.0
  implementation: official_cdcn
training:
  batch_size: 8
  workers: 2
  weight_decay: 0.0001
  stages:
  - name: depth
    epochs: 20
    lr: 0.0001
  - name: head
    epochs: 8
    lr: 0.001
  - name: joint
    epochs: 8
    lr: 1.0e-05
  optimizer: adam
evaluation:
  aggregation: mean
