experiment_id: CASIA_E3B_CDCN_OFFICIAL_STAGED_BCE
seed: 42
runs_dir: /content/drive/MyDrive/face-pad/runs
model:
  name: cdcn_official_head
  theta: 0.7
data:
  manifest: data/manifests/casia_fasd_debug_with_depth.csv
  source_manifest: data/manifests/casia_fasd_debug.csv
  depth_ledger: /content/datasets/casia-fasd/depth/depth_status.csv
  root: /content/datasets/casia-fasd
  image_size: 256
  normalization: cdcn_official
loss:
  implementation: official_cdcn
  classification: bce
  lambda_abs: 1.0
  lambda_contrast: 1.0
  lambda_cls: 1.0
training:
  init_checkpoint: /content/drive/MyDrive/face-pad/runs/CASIA_E1_CDCN_OFFICIAL_seed42_20260921T114029Z/best.ckpt
  selection_metric: classification_bce
  batch_size: 8
  workers: 2
  optimizer: adam
  weight_decay: 0.0001
  stages:
    - name: depth
      epochs: 4
      lr: 0.0001
    - name: head
      epochs: 4
      lr: 0.0001
    - name: joint
      epochs: 8
      lr: 0.0001
evaluation:
  aggregation: mean
