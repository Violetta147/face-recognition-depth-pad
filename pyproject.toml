[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepface-pad"
version = "0.2.0"
description = "Real-time face recognition foundation for a depth-map PAD system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
runtime = ["onnxruntime>=1.18,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepface_pad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
