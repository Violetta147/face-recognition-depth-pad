   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(80.846415 143.620787)">RGB 256×256</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(64.685868 155.93838)">CDCN normalization</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(303.162433 143.620787)">Official CDCN</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(319.904777 155.93838)">θ = 0.7</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(511.930039 143.620787)">Predicted depth</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(528.790117 155.93838)">1×32×32</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="831.756852" y="100.471647" transform="rotate(-0 831.756852 100.471647)">E1: spatial mean → score</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(784.320212 191.252466)">E2 / E3 / E3b / E4</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(773.401852 203.57006)">Conv 1→8→16 → GAP</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(768.076305 215.887653)">Linear 16→1 → sigmoid</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(114.301354 309.474754)">Frozen pseudo-depth cache</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(115.31112 321.792348)">3DDFA V2 live / zero attack</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(450.945113 309.474754)">Train: depth MSE + contrast MSE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(489.107379 321.792348)">Head: BCE or Focal</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="326.074852" y="420.973233" transform="rotate(-0 326.074852 420.973233)">E0: RGB 224×224 → MobileNetV3 Small → sigmoid</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(639.145315 381.760401)">20 frame scores → video mean</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(634.571721 394.077995)">Threshold selected on validation</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(648.961096 406.395589)">No 3DDFA at PAD inference</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle" x="504" y="18.213052" transform="rotate(-0 504 18.213052)">Luồng nghiên cứu và cách đọc bản đồ depth</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(199.058203 489.05001)">Implemented-code schematic. Solid: inference; dashed: supervision. Depth loss applies to E1 and depth/joint stages; E2 trains only the</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(359.253281 499.128041)">BCE head. E0 and CDCN use different input sizes/preprocessing.</text>
  </g>
 </g>
