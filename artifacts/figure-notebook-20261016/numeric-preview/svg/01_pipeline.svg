   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(57.113881 143.620787)">RGB 256×256</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.953334 155.93838)">CDCN normalization</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(290.217415 143.620787)">Official CDCN</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(306.959758 155.93838)">θ = 0.7</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(509.543014 143.620787)">Predicted depth</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(526.403092 155.93838)">1×32×32</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="842.911602" y="100.471647" transform="rotate(-0 842.911602 100.471647)">E1: spatial mean → score</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(795.474962 191.252466)">E2 / E3 / E3b / E4</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(784.556602 203.57006)">Conv 1→8→16 → GAP</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(779.231055 215.887653)">Linear 16→1 → sigmoid</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(94.011644 309.474754)">Frozen pseudo-depth cache</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(95.02141 321.792348)">3DDFA V2 live / zero attack</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(447.869524 309.474754)">Train: depth MSE + contrast MSE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(486.03179 321.792348)">Head: BCE or Focal</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="312.441268" y="420.973233" transform="rotate(-0 312.441268 420.973233)">E0: RGB 224×224 → MobileNetV3 Small → sigmoid</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(645.021068 381.760401)">20 frame scores → video mean</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(640.447474 394.077995)">Threshold selected on validation</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(654.836849 406.395589)">No 3DDFA at PAD inference</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle" x="504" y="18.213052" transform="rotate(-0 504 18.213052)">Luồng nghiên cứu và cách đọc bản đồ depth</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(186.449766 489.05001)">Schematic of implemented code, not measured performance. Solid arrows: inference; dashed arrows: training supervision. E0 and CDCN use</text>
